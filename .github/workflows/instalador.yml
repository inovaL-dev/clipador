name: Criar instalador

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CI: "true"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Montar o programa e o instalador
        run: python empacotar/construir.py
      - name: Publicar a versão
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $origem = Get-ChildItem instalador\*.exe | Select-Object -First 1
          Copy-Item $origem.FullName instalador\Clipador-Instalador.exe
          $hash = (Get-FileHash instalador\Clipador-Instalador.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Clipador-Instalador.exe" | Out-File -Encoding ascii instalador\Clipador-Instalador.exe.sha256
          gh release create "$env:GITHUB_REF_NAME" instalador\Clipador-Instalador.exe instalador\Clipador-Instalador.exe.sha256 --title "Clipador $($env:GITHUB_REF_NAME.TrimStart('v'))" --generate-notes
      - name: Guardar o instalador de teste
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Clipador-Instalador
          path: instalador/*.exe
          retention-days: 7
