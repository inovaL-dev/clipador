name: Verificar código

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Conferir o Python
        run: python -m compileall -q clipador.py programa.py nucleo empacotar
      - name: Conferir o JavaScript
        run: for f in web/*.js; do node --check "$f"; done
